# Netlify build configuration.
#
# Netlify detects Next.js and installs its OpenNext adapter on every build, so
# no [[plugins]] entry is declared here on purpose — pinning one stops the
# adapter updating alongside Next.js.
#
# Keys do NOT go in this file; it is committed. Set GEMINI_API_KEY under
# Project configuration → Environment variables in the Netlify UI.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The build's Node version is also the one the review function runs on.
  # package.json accepts >= 20.9, but Node 20 is past end-of-life.
  NODE_VERSION = "22"
